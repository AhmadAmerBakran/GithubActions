name: PA1000 Freesound Preview Bridge

on:
  push:
    branches:
      - pa1000-binary-bridge

permissions:
  contents: read

jobs:
  fetch-freesound-previews:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve public Freesound preview URLs and fetch HQ previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/audio artifact/provenance artifact/raw
          python3 - <<'PY'
          import json, pathlib, re, urllib.request, hashlib
          ids = [140291, 218920, 696751]
          root = pathlib.Path('artifact')
          rows = ['id\tapi_status\tname\tlicense\thq_ogg\thq_mp3\tfetched\tsize\tsha256\n']

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent':'PA1000-source-audit/1.0'})
              with urllib.request.urlopen(req, timeout=90) as r:
                  return r.read(), r.geturl(), getattr(r, 'status', 200)

          for fsid in ids:
              data = None; info = None; api_status = ''
              for api_url in [f'https://freesound.org/api/sounds/{fsid}', f'https://freesound.org/api/sounds/{fsid}/']:
                  try:
                      raw, final_url, status = fetch(api_url)
                      (root/'raw'/f'{fsid}_api_response.json').write_bytes(raw)
                      info = json.loads(raw.decode('utf-8'))
                      api_status = f'SUCCESS:{status}:{final_url}'
                      break
                  except Exception as e:
                      api_status = f'FAILED:{type(e).__name__}:{e}'
              hq_ogg = ''; hq_mp3 = ''; name=''; lic=''; fetched='NO'; size='0'; sha=''
              if info:
                  name = str(info.get('original_filename') or info.get('name') or '')
                  lic = str(info.get('license') or '')
                  hq_ogg = str(info.get('preview-hq-ogg') or info.get('previews',{}).get('preview-hq-ogg') or '')
                  hq_mp3 = str(info.get('preview-hq-mp3') or info.get('previews',{}).get('preview-hq-mp3') or '')
                  preview_url = hq_ogg or hq_mp3
                  if preview_url:
                      try:
                          pdata, pfinal, pstatus = fetch(preview_url)
                          ext = '.ogg' if ('ogg' in preview_url.lower() or pdata[:4] == b'OggS') else '.mp3'
                          out = root/'audio'/f'{fsid}_hq_preview{ext}'
                          out.write_bytes(pdata)
                          fetched='YES'; size=str(len(pdata)); sha=hashlib.sha256(pdata).hexdigest()
                      except Exception as e:
                          fetched=f'FAILED:{type(e).__name__}:{e}'
              rows.append('\t'.join([str(fsid),api_status,name,lic,hq_ogg,hq_mp3,fetched,size,sha])+'\n')
          (root/'provenance'/'FREESOUND_PREVIEW_BRIDGE.tsv').write_text(''.join(rows), encoding='utf-8')
          PY
          cat artifact/provenance/FREESOUND_PREVIEW_BRIDGE.tsv

      - name: Upload Freesound preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pa1000-freesound-bendir-previews
          path: artifact
          if-no-files-found: error
          retention-days: 7
