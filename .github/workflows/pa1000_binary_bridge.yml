name: PA1000 Freesound Page Probe

on:
  push:
    branches:
      - pa1000-binary-bridge

permissions:
  contents: read

jobs:
  probe-freesound-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public Freesound pages for preview CDN URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/raw artifact/provenance
          python3 - <<'PY'
          import pathlib, re, urllib.request, html
          ids = [140291,218920,696751]
          root = pathlib.Path('artifact')
          rows = ['id\tpage_size\tpreview_url_count\turls\n']
          patterns = [
              r'https?://[^"\'<> ]+(?:previews|preview)[^"\'<> ]+\.(?:ogg|mp3)',
              r'https?://cdn\.freesound\.org/[^"\'<> ]+\.(?:ogg|mp3)',
              r'https?://freesound\.org/data/previews/[^"\'<> ]+\.(?:ogg|mp3)',
          ]
          for fsid in ids:
              url=f'https://freesound.org/people/x/sounds/{fsid}/'
              # Canonical page works by id after redirects regardless of username.
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 PA1000-source-audit/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  data=r.read(); final=r.geturl()
              text=data.decode('utf-8','replace')
              (root/'raw'/f'{fsid}.html').write_text(text,encoding='utf-8')
              urls=set()
              for pat in patterns:
                  urls.update(html.unescape(x) for x in re.findall(pat,text,re.I))
              # Also collect any quoted fragments containing previews/data.
              frags=[]
              for m in re.finditer(r'.{0,180}(?:preview|previews|cdn\.freesound).{0,280}',text,re.I|re.S):
                  frag=' '.join(m.group(0).split())
                  if frag not in frags: frags.append(frag)
                  if len(frags)>=20: break
              (root/'provenance'/f'{fsid}_preview_context.txt').write_text('\n\n'.join(frags),encoding='utf-8')
              rows.append(f"{fsid}\t{len(data)}\t{len(urls)}\t{' | '.join(sorted(urls))}\n")
          (root/'provenance'/'FREESOUND_PAGE_PROBE.tsv').write_text(''.join(rows),encoding='utf-8')
          PY
          cat artifact/provenance/FREESOUND_PAGE_PROBE.tsv

      - name: Upload Freesound page probe
        uses: actions/upload-artifact@v4
        with:
          name: pa1000-freesound-page-probe
          path: artifact
          if-no-files-found: error
          retention-days: 7
