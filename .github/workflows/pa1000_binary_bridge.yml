name: PA1000 FSD50K Zurna Single File Bridge

on:
  push:
    branches:
      - pa1000-binary-bridge

permissions:
  contents: read

jobs:
  fetch-zurna-derivative:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve one FSD50K derivative row without bulk dataset download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/audio artifact/provenance artifact/raw
          python3 - <<'PY'
          import urllib.request, urllib.parse, urllib.error, json, pathlib, hashlib, base64

          root=pathlib.Path('artifact'); aud=root/'audio'; prov=root/'provenance'; raw=root/'raw'
          UA='AhmadAmerBakran-PA1000SourceAudit/1.0 (https://github.com/AhmadAmerBakran/GithubActions)'
          dataset='nguyenvulebinh/fsd50k'
          target=18661

          def get(url,timeout=180):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,*/*'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read(),r.geturl(),getattr(r,'status',200),dict(r.headers)

          dsq=urllib.parse.quote(dataset,safe='')
          split_url=f'https://datasets-server.huggingface.co/splits?dataset={dsq}'
          splits_blob,_,_,_=get(split_url)
          (raw/'splits.json').write_bytes(splits_blob)
          splits_obj=json.loads(splits_blob)
          split_names=[]
          for s in splits_obj.get('splits',[]):
              if s.get('config')=='default': split_names.append(s.get('split'))
          split_names=[x for x in split_names if x]
          print('SPLITS',split_names)

          attempts=[]; found=None
          where=urllib.parse.quote('"fname"=18661',safe='')
          for split in split_names:
              url=f'https://datasets-server.huggingface.co/filter?dataset={dsq}&config=default&split={urllib.parse.quote(split,safe="")}&where={where}&offset=0&length=5'
              try:
                  blob,final,status,headers=get(url,timeout=180)
                  (raw/f'filter_{split}.json').write_bytes(blob)
                  obj=json.loads(blob)
                  rows=obj.get('rows') or []
                  attempts.append({'split':split,'status':status,'rows':len(rows),'url':url})
                  if rows and found is None:
                      found={'split':split,'payload':obj,'url':url}
              except Exception as e:
                  attempts.append({'split':split,'error':f'{type(e).__name__}: {e}','url':url})
          if found is None:
              (prov/'HF_FSD50K_18661_RESULT.json').write_text(json.dumps({'dataset':dataset,'target':target,'attempts':attempts,'found':False},indent=2),encoding='utf-8')
              raise SystemExit('No filtered row for 18661')

          rowwrap=found['payload']['rows'][0]
          row=rowwrap.get('row',rowwrap)
          mp3=row.get('mp3')
          data=None; representation=type(mp3).__name__
          if isinstance(mp3,list):
              data=bytes((int(x)&255) for x in mp3)
          elif isinstance(mp3,dict):
              b=mp3.get('bytes')
              if isinstance(b,list): data=bytes((int(x)&255) for x in b)
              elif isinstance(b,str):
                  try: data=base64.b64decode(b,validate=True)
                  except Exception: pass
              if data is None and mp3.get('path'):
                  try: data,_,_,_=get(mp3['path'])
                  except Exception: pass
          elif isinstance(mp3,str):
              try: data=base64.b64decode(mp3,validate=True)
              except Exception: pass

          result={'dataset':dataset,'target':target,'split':found['split'],'attempts':attempts,'row_index':rowwrap.get('row_idx'),'row_fields':{k:v for k,v in row.items() if k!='mp3'},'mp3_representation':representation,'found':True,'audio_extracted':data is not None}
          if data is not None:
              out=aud/'FSD50K_18661_dataset_derived.mp3'; out.write_bytes(data)
              result.update({'audio_file':out.name,'audio_size':len(data),'audio_sha256':hashlib.sha256(data).hexdigest(),'magic_hex':data[:16].hex()})
              print('AUDIO',len(data),result['audio_sha256'],result['magic_hex'])
          (prov/'HF_FSD50K_18661_RESULT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          (prov/'IDENTITY_GUARD.txt').write_text('This is a Hugging Face / FSD50K dataset-derived copy. It is NOT the Freesound original FLAC. Use for analysis/preflight only until original bytes are legally acquired and verified.\n',encoding='utf-8')
          PY

      - name: Upload one-file FSD50K Zurna bridge
        uses: actions/upload-artifact@v4
        with:
          name: pa1000-fsd50k-zurna-18661-derivative
          path: artifact
          if-no-files-found: error
          retention-days: 7
