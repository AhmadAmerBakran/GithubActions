name: PA1000 VCSL Frame Drum Bridge

on:
  push:
    branches:
      - pa1000-binary-bridge

permissions:
  contents: read

jobs:
  fetch-vcsl-frame-drum:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pinned VCSL frame-drum folder only
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/sgossner/VCSL.git vcsl
          cd vcsl
          git sparse-checkout init --cone
          git sparse-checkout set 'Membranophones/Struck Membranophones/Frame Drum'
          git checkout c1ea7bcc3c7309650ab0da9d15c9cd1fbc4a4c7e
          test "$(git rev-parse HEAD)" = "c1ea7bcc3c7309650ab0da9d15c9cd1fbc4a4c7e"

      - name: Collect exact WAVs and provenance
        shell: bash
        run: |
          set -euo pipefail
          src='vcsl/Membranophones/Struck Membranophones/Frame Drum'
          mkdir -p artifact/frame_drum artifact/provenance
          cp "$src"/*.wav artifact/frame_drum/
          cp vcsl/LICENSE artifact/provenance/VCSL_LICENSE_CC0.txt
          printf '%s\n' 'c1ea7bcc3c7309650ab0da9d15c9cd1fbc4a4c7e' > artifact/provenance/SOURCE_COMMIT.txt
          printf '%s\n' 'Membranophones/Struck Membranophones/Frame Drum' > artifact/provenance/SOURCE_PATH.txt
          find artifact/frame_drum -maxdepth 1 -type f -name '*.wav' -printf '%f\n' | LC_ALL=C sort > artifact/provenance/FILENAMES.txt
          test "$(wc -l < artifact/provenance/FILENAMES.txt)" -eq 18
          : > artifact/provenance/SHA256SUMS.txt
          : > artifact/provenance/GIT_BLOB_SHA1.txt
          : > artifact/provenance/SIZES.txt
          python3 - <<'PY'
          import pathlib, wave, hashlib, subprocess
          root=pathlib.Path('artifact/frame_drum')
          rows=['filename\tsample_rate\tchannels\tsample_width_bytes\tframes\tduration_s\n']
          for p in sorted(root.glob('*.wav')):
              raw=p.read_bytes()
              if raw[:4] not in (b'RIFF',b'RF64') or raw[8:12] != b'WAVE':
                  raise SystemExit(f'Not WAV: {p}')
              try:
                  with wave.open(str(p),'rb') as w:
                      sr=w.getframerate(); ch=w.getnchannels(); sw=w.getsampwidth(); n=w.getnframes()
              except wave.Error as e:
                  raise SystemExit(f'WAV parse failed {p}: {e}')
              rows.append(f'{p.name}\t{sr}\t{ch}\t{sw}\t{n}\t{n/sr:.9f}\n')
          pathlib.Path('artifact/provenance/WAV_METADATA.tsv').write_text(''.join(rows),encoding='utf-8')
          PY
          while IFS= read -r name; do
            file="artifact/frame_drum/$name"
            rel="Membranophones/Struck Membranophones/Frame Drum/$name"
            sha256sum "$file" >> artifact/provenance/SHA256SUMS.txt
            printf '%s  %s\n' "$(git -C vcsl hash-object "$rel")" "$name" >> artifact/provenance/GIT_BLOB_SHA1.txt
            printf '%s  %s\n' "$(stat -c '%s' "$file")" "$name" >> artifact/provenance/SIZES.txt
          done < artifact/provenance/FILENAMES.txt
          cat artifact/provenance/WAV_METADATA.tsv

      - name: Upload VCSL Frame Drum artifact
        uses: actions/upload-artifact@v4
        with:
          name: pa1000-vcsl-frame-drum-c1ea7bcc
          path: artifact
          if-no-files-found: error
          retention-days: 7
