name: PA1000 Freesound Page Probe

on:
  push:
    branches:
      - pa1000-binary-bridge

permissions:
  contents: read

jobs:
  probe-freesound-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public Freesound pages for preview CDN URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/raw artifact/provenance artifact/audio
          python3 - <<'PY'
          import pathlib, re, urllib.request, html, hashlib
          items = [
              (140291,'barisbozkurt'),
              (218920,'xserra'),
              (696751,'hadescolossus'),
          ]
          root = pathlib.Path('artifact')
          rows = ['id\tuser\tpage_size\tpreview_url_count\turls\n']
          patterns = [
              r'https?://[^"\'<> ]+(?:previews|preview)[^"\'<> ]+\.(?:ogg|mp3)',
              r'https?://cdn\.freesound\.org/[^"\'<> ]+\.(?:ogg|mp3)',
              r'https?://freesound\.org/data/previews/[^"\'<> ]+\.(?:ogg|mp3)',
          ]
          for fsid,user in items:
              url=f'https://freesound.org/people/{user}/sounds/{fsid}/'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 PA1000-source-audit/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  data=r.read(); final=r.geturl()
              text=data.decode('utf-8','replace')
              (root/'raw'/f'{fsid}.html').write_text(text,encoding='utf-8')
              urls=set()
              for pat in patterns:
                  urls.update(html.unescape(x) for x in re.findall(pat,text,re.I))
              frags=[]
              for m in re.finditer(r'.{0,220}(?:preview|previews|cdn\.freesound|data/previews).{0,320}',text,re.I|re.S):
                  frag=' '.join(m.group(0).split())
                  if frag not in frags: frags.append(frag)
                  if len(frags)>=30: break
              (root/'provenance'/f'{fsid}_preview_context.txt').write_text('\n\n'.join(frags),encoding='utf-8')
              # Download all unique preview urls discovered, preferring HQ OGG later in local QA.
              for i,purl in enumerate(sorted(urls),1):
                  try:
                      req2=urllib.request.Request(purl,headers={'User-Agent':'Mozilla/5.0 PA1000-source-audit/1.0'})
                      with urllib.request.urlopen(req2,timeout=90) as r2:
                          pdata=r2.read()
                      ext='.ogg' if pdata[:4]==b'OggS' or '.ogg' in purl.lower() else '.mp3'
                      out=root/'audio'/f'{fsid}_preview_{i:02d}{ext}'
                      out.write_bytes(pdata)
                      (root/'provenance'/f'{fsid}_preview_{i:02d}.sha256').write_text(hashlib.sha256(pdata).hexdigest()+'  '+out.name+'\n')
                  except Exception as e:
                      (root/'provenance'/f'{fsid}_preview_{i:02d}.error.txt').write_text(f'{type(e).__name__}: {e}\nURL={purl}\n')
              rows.append(f"{fsid}\t{user}\t{len(data)}\t{len(urls)}\t{' | '.join(sorted(urls))}\n")
          (root/'provenance'/'FREESOUND_PAGE_PROBE.tsv').write_text(''.join(rows),encoding='utf-8')
          PY
          cat artifact/provenance/FREESOUND_PAGE_PROBE.tsv

      - name: Upload Freesound page probe
        uses: actions/upload-artifact@v4
        with:
          name: pa1000-freesound-page-probe
          path: artifact
          if-no-files-found: error
          retention-days: 7
